<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'appointments')}">

<body>

  <h2>Book Appointment</h2>

  <b>Pet: </b><span th:text="${pet.name}">Pet Name</span>
  <span th:if="${pet.owner != null}">
    (<span th:text="${pet.owner.firstName + ' ' + pet.owner.lastName}">Owner</span>)
  </span>

  <form th:object="${appointment}" th:action="@{/owners/{ownerId}/pets/{petId}/appointments/new(ownerId=${pet.owner.id},petId=${pet.id})}" method="post" class="form-horizontal">

    <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
      <p th:each="err : ${#fields.globalErrors()}" th:text="${err}">Error</p>
    </div>

    <div class="form-group">
      <label class="col-sm-2 control-label">Veterinarian</label>
      <div class="col-sm-10">
        <select name="vetId" class="form-control" required="required">
          <option value="">-- Select a Vet --</option>
          <option th:each="vet : ${vets}" th:value="${vet.id}" th:text="${vet.firstName + ' ' + vet.lastName}">Vet</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label class="col-sm-2 control-label">Type</label>
      <div class="col-sm-10">
        <select th:field="*{appointmentType}" class="form-control">
          <option th:each="type : ${appointmentTypes}" th:value="${type}" th:text="${type.name() + ' (' + type.defaultDurationMinutes + ' min)'}">Type</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label class="col-sm-2 control-label">Date</label>
      <div class="col-sm-10">
        <input type="date" th:field="*{appointmentDate}" class="form-control" required="required" />
        <span class="help-inline" th:if="${#fields.hasErrors('appointmentDate')}">
          <span th:errors="*{appointmentDate}">Date Error</span>
        </span>
      </div>
    </div>

    <div class="form-group">
      <label class="col-sm-2 control-label">Start Time</label>
      <div class="col-sm-10">
        <input type="time" th:field="*{startTime}" class="form-control" step="900" required="required" />
        <span class="help-inline" th:if="${#fields.hasErrors('startTime')}">
          <span th:errors="*{startTime}">Time Error</span>
        </span>
        <span class="help-block">Times must be in 15-minute intervals (e.g., 09:00, 09:15, 09:30)</span>
      </div>
    </div>

    <div class="form-group">
      <label class="col-sm-2 control-label">Description</label>
      <div class="col-sm-10">
        <textarea th:field="*{description}" class="form-control" rows="3" placeholder="Reason for visit (optional)"></textarea>
      </div>
    </div>

    <div class="form-group">
      <div class="col-sm-offset-2 col-sm-10">
        <button class="btn btn-default" type="submit">Book Appointment</button>
      </div>
    </div>

  </form>

</body>

</html>
